<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraCore Library Management System login">
  <title>Login | LibraCore</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <path d="M12 6v6"/>
            <path d="M15 9l-3-3-3 3"/>
          </svg>
        </div>
        <div>
          <h1>LibraCore</h1>
          <p>Techno Main Salt Lake</p>
        </div>
      </div>

      <div class="login-heading">
        <h2 id="login-title">Welcome back</h2>
        <p>Sign in to manage your library.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
          <div class="password-label-row">
            <label for="password">Password</label>
            <button type="button" class="show-password" id="toggle-password">Show</button>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        </div>

        <div class="login-options">
          <label class="remember"><input type="checkbox" id="remember-me"> <span>Remember me</span></label>
          <span class="demo-label">Library Admin</span>
        </div>

        <button class="login-btn" type="submit">Sign In</button>
        <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
      </form>

      <div class="demo-box">
        <strong>Demo credentials</strong>
        <span>Username: <b>admin</b></span>
        <span>Password: <b>admin123</b></span>
      </div>

      <p class="login-footer">Library Management System &bull; LibraCore</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
