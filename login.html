<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LibraCore Library Management System login">
  <title>Login | LibraCore</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <path d="M12 6v6"/>
            <path d="M15 9l-3-3-3 3"/>
          </svg>
        </div>
        <div>
          <h1>LibraCore</h1>
          <p>Techno Main Salt Lake</p>
        </div>
      </div>

      <div class="login-heading">
        <h2 id="login-title">Welcome back</h2>
        <p id="login-description">Sign in to manage your library.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group" id="name-group" hidden>
          <label for="full-name">Full name</label>
          <input id="full-name" name="name" type="text" autocomplete="name" maxlength="120">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required autofocus>
        </div>

        <div class="form-group" id="password-group">
          <div class="password-label-row">
            <label for="password">Password</label>
            <button type="button" class="show-password" id="toggle-password">Show</button>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" minlength="8">
        </div>

        <button class="login-btn" id="submit-auth" type="submit">Sign In</button>
        <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        <div class="auth-links">
          <button type="button" id="forgot-password">Forgot password?</button>
          <button type="button" id="switch-auth-mode">Create account</button>
        </div>
      </form>

      <p class="login-footer">Library Management System &bull; LibraCore</p>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
